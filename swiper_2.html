<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <!-- Link Swiper's CSS -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.css"
    />
    <!-- Swiper JS -->
    <script src="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.js"></script>
    <link rel="stylesheet" href="css/swiper.css" />
    <script defer src="js/swiper.js"></script>
  </head>
  <body>
    <!-- swiper - visual -->
    <div class="visual">
      <div class="swiper visualSwiper">
        <div class="swiper-wrapper">
          <div class="swiper-slide">
            <img src="images/sw_01.png" alt="swiper-img" />
          </div>
          <div class="swiper-slide">
            <img src="images/sw_02.png" alt="swiper-img" />
          </div>
          <div class="swiper-slide">
            <img src="images/sw_03.png" alt="swiper-img" />
          </div>
        </div>
        <div class="swiper-button-next"></div>
        <div class="swiper-button-prev"></div>
        <div class="swiper-pagination"></div>
      </div>
    </div>
    <!-- product -->
    <div class="product">
      <div class="inner">
        <div class="swiper proSwiper">
          <div class="swiper-wrapper">
            <div class="swiper-slide">
              <img src="images/about-03-1.png" alt="about" />
              <div class="item-txt">
                <p>상품 설명 : 1</p>
                <p>상품 가격: 2,000원</p>
              </div>
            </div>
            <div class="swiper-slide">
              <img src="images/about-05-1.png" alt="about" />
              <div class="item-txt">
                <p>상품 설명 : 2</p>
                <p>상품 가격: 2,000원</p>
              </div>
            </div>
            <div class="swiper-slide">
              <img src="images/about-08-2.png" alt="about" />
              <div class="item-txt">
                <p>상품 설명 : 3</p>
                <p>상품 가격: 2,000원</p>
              </div>
            </div>
            <div class="swiper-slide">
              <img src="images/about-03-1.png" alt="about" />
              <div class="item-txt">
                <p>상품 설명 : 4</p>
                <p>상품 가격: 2,000원</p>
              </div>
            </div>
            <div class="swiper-slide">
              <img src="images/about-05-1.png" alt="about" />
              <div class="item-txt">
                <p>상품 설명 : 5</p>
                <p>상품 가격: 2,000원</p>
              </div>
            </div>
            <div class="swiper-slide">
              <img src="images/about-08-2.png" alt="about" />
              <div class="item-txt">
                <p>상품 설명 : 6</p>
                <p>상품 가격: 2,000원</p>
              </div>
            </div>
          </div>
          <div class="swiper-button-next"></div>
          <div class="swiper-button-prev"></div>
          <div class="swiper-pagination"></div>
        </div>
      </div>
    </div>
  </body>
</html>
